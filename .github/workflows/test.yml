name: Test raw.githack.com

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build test stage
        run: docker build -f Containerfile --target test -t rawgithack:test .

      - name: Run Test::Nginx suite
        run: docker run --rm -v .:/etc/nginx/rawgithack rawgithack:test